name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: node plugin/check.js
      - run: python plugin/check-colors.py
      - run: python scripts/check-sync.py
      - run: python -m py_compile plugin/analyzer.py scripts/sync.py
